name: gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the claim gate's seal is checked against the commit that sealed it
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: unit suites
        run: node --test voice-core.test.mjs claim-gate.test.mjs
      - name: the claim gate's seal, and its six claims re-measured against receipts fetched at their pins
        run: |
          node tools/claimgate-measure.mjs --check
          node tools/claimgate-measure.mjs --verify

  voice-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: witness gates the voice kernel
        run: node vendor/witness/witness.mjs mutate voice-core.mjs --cap 400 --timeout 120000 --test node --test voice-core.test.mjs
      - name: witness gates the claim gate (nothing baselined; refuse anything short of clean)
        run: |
          node vendor/witness/witness.mjs mutate claim-gate.mjs --cap 1000 --timeout 120000 --test node --test claim-gate.test.mjs | tee cg.out
          grep -q '"clean": true' cg.out || { echo "::error::mutants survived in claim-gate.mjs"; exit 1; }
