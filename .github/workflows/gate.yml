name: gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: unit suite
        run: node --test voice-core.test.mjs

  voice-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: witness gates the voice kernel
        run: node vendor/witness/witness.mjs mutate voice-core.mjs --cap 400 --timeout 120000 --test node --test voice-core.test.mjs
